name: Tests App
on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - main

jobs:
  test:
    name: Tests et Couverture
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build --no-restore --configuration Release
      
      - name: Run Unit Tests
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --filter "FullyQualifiedName~Domain|FullyQualifiedName~Application.ProductServiceTests|FullyQualifiedName~Application.SupplierServiceTests" \
            --collect:"XPlat Code Coverage" \
            --results-directory:"TestResults/Unit" \
            --logger "trx;LogFileName=unit-tests.trx" \
            --verbosity normal
      
      - name: Run Integration Tests
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --filter "FullyQualifiedName~Integration" \
            --collect:"XPlat Code Coverage" \
            --results-directory:"TestResults/Integration" \
            --logger "trx;LogFileName=integration-tests.trx" \
            --verbosity normal
      
      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool
      
      - name: Generate Coverage Report
        run: |
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coveragereport" \
            -reporttypes:"Html;Cobertura;MarkdownSummaryGithub" \
            -classfilters:"-*.Tests.*"
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coveragereport/Cobertura.xml
          flags: unittests,integrationtests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx
          fail-on-error: true
      
      - name: Upload Coverage Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coveragereport/
          retention-days: 30
      
      - name: Comment PR with Coverage
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: coveragereport/SummaryGithub.md
